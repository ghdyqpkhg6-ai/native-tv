# Fork-only. Builds the ARM runtime and TV client exactly as the Homebrew
# Channel package does (.github/actions/package-ipk: same pinned SDK, same
# build.py call), then exports what native-tv/lifecycle/deploy.sh reads, so
# the developer's SSH deploy can run on a computer without the SDK.
# Runs only on pushes to the deploy-build (original) and custom (fork changes) branches, or by hand.
name: Fork deploy inputs

on:
  push:
    branches: [deploy-build, custom]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    # The SDK's only Linux build is arm64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: install the webOSbrew SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config
          curl -fsSL https://github.com/webosbrew/native-toolchain/releases/download/webos-d7ed7ee.6/arm-webos-linux-gnueabi_sdk-buildroot_linux-aarch64.tar.bz2 | tar -xj -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh"

      - name: build the ARM runtime and the TV client
        run: python3 native-tv/build.py --sdk "$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot"

      - name: export deploy.sh inputs
        run: python3 .github/fork/export-deploy-inputs.py native-tv/build-webos export

      - uses: actions/upload-artifact@v4
        with:
          name: nativetv-deploy-inputs
          path: export/
          include-hidden-files: true
          if-no-files-found: error
